plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	runs {
		client {
			// Relative to this subproject, so the dev world stays in the repo-root run-1.21.1 it
			// has always lived in.
			runDir "../run-26.1.2"
		}
		server {
			runDir "../run-26.1.2-server"
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	// Files in this configuration are bundled into the mod jar by the Shadow plugin.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	implementation "net.fabricmc:fabric-loader:$rootProject.loader_version"
	implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_version"

	implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

	implementation "maven.modrinth:midnightlib:$rootProject.midnightlib_fabric_version"

	// REI Stuff
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rootProject.rei_version"
	// The default-plugin artifact carries BuiltinPlugin and DefaultCustomDisplay, which the
	// api jar does not. Compiling against it instead of the full loader jar keeps those
	// classes reachable without putting two jars that share classes on one classpath.
	compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin:$rootProject.rei_version"
	runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rootProject.rei_version"

	common(project(path: ':common')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

// Minecraft is not obfuscated on this version, so loom-no-remap produces no remapJar task: the
// shaded jar is the one that ships.
jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = null
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

assemble.dependsOn shadowJar

configurations {
	apiElements { outgoing.artifacts.clear(); outgoing.artifact(shadowJar) }
	runtimeElements { outgoing.artifacts.clear(); outgoing.artifact(shadowJar) }
}
