plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

loom {
	runs {
		client {
			runDir "../run-26.1.2-neoforge"
		}
		server {
			runDir "../run-26.1.2-neoforge-server"
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	// Files in this configuration are bundled into the mod jar by the Shadow plugin.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

	implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

	implementation "maven.modrinth:midnightlib:$rootProject.midnightlib_neoforge_version"

	// REI Stuff - same split as the fabric module: api to compile the plugin against, the full jar
	// for the default plugin classes, and the full jar again at runtime so the dev client has it.
	// api-neoforge is the only artifact carrying the @REIPluginClient annotation REI uses to
	// discover plugins on this loader; default-plugin carries BuiltinPlugin/DefaultCustomDisplay.
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version"
	compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin:$rootProject.rei_version"
	runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rootProject.rei_version"

	common(project(path: ':common')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: inputs.properties.version
	}
}

// Minecraft is not obfuscated on this version, so loom-no-remap produces no remapJar task: the
// shaded jar is the one that ships.
jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = null
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

assemble.dependsOn shadowJar

configurations {
	apiElements { outgoing.artifacts.clear(); outgoing.artifact(shadowJar) }
	runtimeElements { outgoing.artifacts.clear(); outgoing.artifact(shadowJar) }
}
