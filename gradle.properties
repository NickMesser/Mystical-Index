# Done to increase the memory available to gradle.
	org.gradle.jvmargs=-Xmx8G

# Minecraft Properties
	# check these on https://fabricmc.net/versions.html
	minecraft_version=1.21.1
	yarn_mappings=1.21.1+build.3
	# Architectury Loom needs a small patch layer on top of yarn to map the two members NeoForge
	# renames; without it the neoforge module cannot resolve yarn mappings at all.
	yarn_mappings_patch_neoforge_version=1.21+build.6

# Mod Properties
	mod_version = 1.21.1-1.1
	maven_group = net.messer
	archives_base_name = mystical_index
	enabled_platforms = fabric,neoforge

# Loader Dependencies
	loader_version=0.16.14
	fabric_version=0.116.15+1.21.1
	neoforge_version=21.1.248

# Architectury
	architectury_api_version=13.0.11

# MidnightLib
	midnightlib_fabric_version=1.9.3+1.21.1-fabric
	midnightlib_neoforge_version=1.9.3+1.21.1-neoforge

# REI Version
	rei_version=16.0.799
