plugins {
	id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
	id 'architectury-plugin' version '3.5-SNAPSHOT'
	id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base {
		// e.g. mystical_index-fabric, mystical_index-neoforge
		archivesName = "$rootProject.archives_base_name-$project.name"
	}

	repositories {
		maven {
			name = "Midnight Config"
			url = uri("https://api.modrinth.com/maven")
		}
		maven { url = uri("https://jitpack.io") }
		maven { url = uri("https://maven.shedaniel.me") }
	}

	dependencies {
		minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
		// No mappings. 26.1.2 ships unobfuscated, which is exactly what the loom-no-remap plugin
		// above is for: the game is already under its official names on both loaders, so there is
		// nothing to translate and no mapping set to declare.
	}

	java {
		// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
		// if it is present.
		withSourcesJar()

		// 26.1.2 declares java-runtime-epsilon / major version 25, and its classes are compiled to
		// match, so nothing older can even read them. Gradle itself still runs on 21; the toolchain
		// is what forks a 25 compiler.
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		// Default cap of 100 hides most of the surface while porting across major versions.
		it.options.compilerArgs.addAll(["-Xmaxerrs", "3000"])
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java
			}
		}

		repositories {
			// Add repositories to publish to here.
		}
	}
}
