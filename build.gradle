plugins {
	id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
	id 'architectury-plugin' version '3.5-SNAPSHOT'
	id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base {
		// e.g. mystical_index-fabric, mystical_index-neoforge
		archivesName = "$rootProject.archives_base_name-$project.name"
	}

	repositories {
		maven {
			name = "Midnight Config"
			url = uri("https://api.modrinth.com/maven")
		}
		maven { url = uri("https://jitpack.io") }
		maven { url = uri("https://maven.shedaniel.me") }
	}

	dependencies {
		minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
		// Yarn on both loaders. NeoForge renames two vanilla members that yarn still names the
		// vanilla way, so the mapping set is layered with Architectury's patch to cover them.
		mappings loom.layered {
			it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
			it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
		}
	}

	java {
		// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
		// if it is present.
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java
			}
		}

		repositories {
			// Add repositories to publish to here.
		}
	}
}
